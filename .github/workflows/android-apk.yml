name: Android APK (personal test builds)

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable debug and dev APKs
    # Push already builds same-repository PR branches; avoid duplicate runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned submodules with shallow history
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK package "tools" is no longer published.
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Optional: store the SAME Android Studio debug.keystore as the
      # ANDROID_DEBUG_KEYSTORE_BASE64 repository secret to enable in-place
      # upgrades between different CI runs. Never commit a signing key.
      - name: Restore stable debug signing key (optional)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_B64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable debug signing certificate restored from Actions secret."
          else
            echo "Using an ephemeral debug certificate. Reinstalling a newer CI build may require uninstalling the older personal build."
          fi

      - name: Inject personal EZPay keys for private dev builds
        if: ${{ github.event.repository.private && github.event_name != 'pull_request' }}
        shell: bash
        env:
          EZPAY_STATIC_KEYS_B64: ${{ secrets.EZPAY_STATIC_KEYS_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${EZPAY_STATIC_KEYS_B64}" ]]; then
            echo "No EZPAY_STATIC_KEYS_B64 configured; personal APK will require key import."
            exit 0
          fi
          umask 077
          mkdir -p src/dev/assets/keys/static
          printf '%s' "$EZPAY_STATIC_KEYS_B64" | base64 --decode > src/dev/assets/keys/static/tehran-ezpay.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          file = Path("src/dev/assets/keys/static/tehran-ezpay.json")
          data = json.loads(file.read_text())
          keys = data.get("keys")
          if data.get("KeyType") != "MifareClassicStatic" or not isinstance(keys, list) or not keys:
              raise SystemExit("Invalid MIFARE Classic static-key document")
          for entry in keys:
              if (entry.get("type") not in ("KeyA", "KeyB")
                      or not isinstance(entry.get("sector"), int)
                      or not 0 <= entry["sector"] <= 39
                      or not isinstance(entry.get("key"), str)
                      or re.fullmatch(r"[0-9a-fA-F]{12}", entry["key"]) is None):
                  raise SystemExit("Invalid MIFARE Classic sector-key entry")
          print("Personal static-key document validated (values withheld).")
          PY
          echo "DEV_EZPAY_KEYS_INCLUDED=1" >> "$GITHUB_ENV"

      - name: Verify build environment
        run: |
          java -version
          git submodule status
          chmod +x ./gradlew
          ./gradlew --version

      # Existing "dev" build type has applicationIdSuffix '.dev', so it
      # installs beside stock Metrodroid. It is debug-signed, NOT a release.
      - name: Build side-by-side dev APK
        run: ./gradlew assembleDev --no-daemon --stacktrace --max-workers=2

      - name: Verify packaged dev provider authorities
        shell: bash
        run: |
          set -euo pipefail
          apk=(build/outputs/apk/dev/*.apk)
          test -f "${apk[0]}"
          package_id="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apk[0]}" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test -n "$package_id"
          echo "APK package: $package_id"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "${apk[0]}" AndroidManifest.xml > "$RUNNER_TEMP/dev-manifest.txt"
          for authority in "$package_id.cardprovider" "$package_id.keyprovider"; do
            if ! grep 'android:authorities' "$RUNNER_TEMP/dev-manifest.txt" | grep -Fq "$authority"; then
              echo "::error::Provider authority '$authority' missing from packaged AndroidManifest.xml"
              grep 'android:authorities' "$RUNNER_TEMP/dev-manifest.txt" || true
              exit 1
            fi
            echo "Verified packaged provider authority: $authority"
          done

      - name: Verify dev key packaging policy
        shell: bash
        run: |
          set -euo pipefail
          apk=(build/outputs/apk/dev/*.apk)
          key_asset="assets/keys/static/tehran-ezpay.json"
          packaged=0
          if unzip -Z1 "${apk[0]}" | grep -Fxq "$key_asset"; then
            packaged=1
          fi
          if [[ "${DEV_EZPAY_KEYS_INCLUDED:-0}" == "1" ]]; then
            if [[ "$packaged" != "1" ]]; then
              echo "::error::Private personal key asset not packaged into dev APK"
              exit 1
            fi
            echo "Private personal dev key asset packaged; NEVER redistribute this APK."
          elif [[ "$packaged" == "1" ]]; then
            echo "::error::Personal keys appeared in an unapproved APK"
            exit 1
          else
            echo "Unkeyed dev APK verified; user key import remains available."
          fi

      - name: Upload dev APK (recommended for phone testing)
        uses: actions/upload-artifact@v4
        with:
          name: metrodroid-dev-${{ github.sha }}
          path: build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify dev card persistence (Robolectric)
        run: ./gradlew testDevUnitTest --tests '*CardProviderTest' --no-daemon --stacktrace --max-workers=2

      # Debug APK uses the stock package ID and cannot be installed over an
      # official Metrodroid APK signed with a different certificate.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: metrodroid-debug-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Installation instructions
        if: success()
        run: |
          {
            echo "## Android APKs are ready"
            echo ""
            echo "Download the **metrodroid-dev** artifact to test alongside the official app."
            echo "Extract the artifact ZIP, then install the contained APK on Android."
            echo 'The dev build uses the .dev application ID suffix and a temporary debug signing certificate.'
            echo "The **metrodroid-debug** artifact uses the original application ID and may conflict with an existing installation."
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
